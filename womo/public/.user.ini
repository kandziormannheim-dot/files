; PHP-Grenzen für die Fotouploads (gilt bei PHP-FPM/CGI je Verzeichnis).
; Bis zu 6 Fotos je Meldung, je höchstens 12 MB vor der Neukodierung —
; und GD braucht beim Dekodieren großer Handy-Fotos ordentlich Speicher.
upload_max_filesize = 15M
post_max_size = 80M
max_file_uploads = 20
memory_limit = 512M
