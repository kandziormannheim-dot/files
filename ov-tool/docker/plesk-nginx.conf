# Plesk: Domain → „Apache & nginx-Einstellungen“ → „Proxy-Modus“ aus → in „Zusätzliche nginx-Anweisungen“ einfügen.
# HTTPS und Zertifikat (Let's Encrypt) übernimmt Plesk; Port 3000 = APP_PORT aus .env. Siehe docs/betrieb.md.
location ~ / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # bewusst nur die echte Client-IP (nicht anhängen): das Login-Rate-Limit liest den ersten Eintrag
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Uploads (Audio-Transkripte) dürfen groß sein; PDF-Erzeugung kann dauern
    client_max_body_size 300m;
    proxy_read_timeout 300s;

    add_header X-Content-Type-Options "nosniff" always;
    # Einbettung: CSP frame-ancestors setzt die App selbst (erlaubt cloud.cdu-sf.de)
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
