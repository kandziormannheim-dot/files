<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Chat-Demo</title>
<!--
  Vereinfachte Nachbildung eines KI-Chat-Assistenten für die Anleitungsfilme
  (werkzeuge/anleitungen.mjs). Keine echte Verbindung, keine Logos. ?app=claude
  oder ?app=gemini wählt Beschriftungen und Farben. Die Filme steuern die
  Seite über window.demo.
-->
<style>
  :root { --grund: #f7f6f2; --leiste: #efede6; --tinte: #1f1f1d; --tinte2: #6b6a64; --linie: #dedbd2; --akzent: #b8643d; --blase: #e9e6dc; --karte: #fff; }
  body.gemini { --grund: #fbfcfe; --leiste: #f0f3f9; --tinte: #1f1f1f; --tinte2: #5f6368; --linie: #dde3ea; --akzent: #3b6fd8; --blase: #e8eef9; --karte: #fff; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template-columns: 260px 1fr; font: 15px/1.55 "Segoe UI", "DejaVu Sans", Arial, sans-serif; color: var(--tinte); background: var(--grund); overflow: hidden; }
  .band { position: fixed; top: 0; right: 0; left: 260px; text-align: center; font-size: 12px; color: var(--tinte2); padding: 5px; background: repeating-linear-gradient(135deg, transparent 0 10px, rgba(0,0,0,.025) 10px 20px); border-bottom: 1px solid var(--linie); z-index: 5; }
  aside { background: var(--leiste); border-right: 1px solid var(--linie); padding: 14px 12px; display: flex; flex-direction: column; gap: 6px; }
  .marke { font-weight: 700; font-size: 20px; padding: 6px 8px 12px; display: flex; gap: 8px; align-items: center; }
  .marke i { width: 22px; height: 22px; border-radius: 6px; background: var(--akzent); display: inline-block; }
  aside button { all: unset; cursor: pointer; padding: 8px 10px; border-radius: 8px; display: flex; gap: 10px; align-items: center; font-size: 14.5px; }
  aside button:hover, aside button.an { background: rgba(0,0,0,.06); }
  aside .neu { background: var(--karte); border: 1px solid var(--linie); font-weight: 600; margin-bottom: 8px; }
  aside h6 { margin: 14px 10px 4px; font-size: 12px; color: var(--tinte2); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  aside .verlauf { color: var(--tinte2); font-size: 13.5px; }
  aside .konto { margin-top: auto; font-size: 13px; color: var(--tinte2); padding: 8px 10px; border-top: 1px solid var(--linie); }
  main { position: relative; display: flex; flex-direction: column; min-width: 0; padding-top: 28px; }
  .ansicht { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .ansicht.an { display: flex; }
  .kopf { padding: 12px 28px; display: flex; justify-content: space-between; align-items: center; color: var(--tinte2); font-size: 14px; }
  .modell { border: 1px solid var(--linie); border-radius: 8px; padding: 4px 10px; background: var(--karte); }
  .verlaufsfeld { flex: 1; overflow-y: auto; padding: 10px 0 20px; }
  .spalte { max-width: 760px; margin: 0 auto; padding: 0 24px; display: grid; gap: 18px; }
  .gruss { text-align: center; margin-top: 110px; font-size: 32px; font-weight: 600; }
  .gruss small { display: block; font-size: 16px; color: var(--tinte2); font-weight: 400; margin-top: 6px; }
  .msg.ich { justify-self: end; background: var(--blase); border-radius: 16px; padding: 10px 16px; max-width: 80%; white-space: pre-wrap; }
  .msg.ki { white-space: pre-wrap; }
  .msg.ki b { font-weight: 650; }
  .anhangkarte { justify-self: end; display: flex; gap: 10px; align-items: center; border: 1px solid var(--linie); background: var(--karte); border-radius: 10px; padding: 8px 12px; font-size: 13.5px; }
  .anhangkarte i, .chip i { width: 26px; height: 30px; border-radius: 4px; background: #d9534f; color: #fff; font-style: normal; font-size: 10px; display: grid; place-items: center; font-weight: 700; }
  .eingabe { padding: 0 24px 22px; }
  .box { max-width: 760px; margin: 0 auto; background: var(--karte); border: 1px solid var(--linie); border-radius: 18px; box-shadow: 0 2px 10px rgba(0,0,0,.05); padding: 12px 14px 10px; display: grid; gap: 8px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { display: flex; align-items: center; gap: 8px; font-size: 13px; border: 1px solid var(--linie); border-radius: 10px; padding: 5px 10px; }
  .chip i { width: 20px; height: 24px; font-size: 8px; }
  textarea { border: 0; outline: 0; resize: none; font: inherit; min-height: 48px; background: transparent; color: var(--tinte); }
  .zeile { display: flex; justify-content: space-between; align-items: center; }
  .rund { all: unset; cursor: pointer; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; border: 1px solid var(--linie); color: var(--tinte2); }
  .senden { background: var(--akzent); color: #fff; border: 0; }
  .menue { position: absolute; background: var(--karte); border: 1px solid var(--linie); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 6px; display: none; min-width: 230px; z-index: 9; }
  .menue.an { display: block; }
  .menue button { all: unset; display: block; cursor: pointer; padding: 9px 12px; border-radius: 8px; width: 100%; box-sizing: border-box; }
  .menue button:hover { background: var(--blase); }
  .seite { max-width: 760px; margin: 20px auto; padding: 0 24px; width: 100%; display: grid; gap: 16px; overflow-y: auto; }
  .seite h1 { font-size: 26px; margin: 10px 0 0; }
  .seite p { margin: 0; color: var(--tinte2); }
  .karten { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .karte { background: var(--karte); border: 1px solid var(--linie); border-radius: 12px; padding: 14px 16px; display: grid; gap: 4px; }
  .karte b { font-size: 15.5px; }
  .karte span { color: var(--tinte2); font-size: 13px; }
  .knopf { all: unset; cursor: pointer; background: var(--tinte); color: var(--grund); padding: 9px 16px; border-radius: 10px; font-weight: 600; justify-self: start; }
  .feld { display: grid; gap: 6px; }
  .feld label { font-weight: 600; font-size: 14px; }
  .feld input, .feld textarea { border: 1px solid var(--linie); border-radius: 10px; padding: 10px 12px; font: inherit; background: var(--karte); }
  .feld textarea { min-height: 110px; }
  .zwei { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; align-items: start; }
  .wissen { background: var(--karte); border: 1px solid var(--linie); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
  .cursor { display: inline-block; width: 8px; height: 16px; background: var(--akzent); vertical-align: -2px; animation: bl .8s steps(2) infinite; }
  @keyframes bl { 50% { opacity: 0; } }
</style>
</head>
<body>
<div class="band" id="band"></div>
<aside>
  <div class="marke"><i></i><span id="appname">Assistent</span></div>
  <button class="neu" id="neuer-chat">＋ <span id="t-neu">Neuer Chat</span></button>
  <button id="nav-chats" class="an">💬 <span>Chats</span></button>
  <button id="nav-sammlung">▦ <span id="t-sammlung">Projekte</span></button>
  <h6>Zuletzt</h6>
  <button class="verlauf">Statusbericht Sprint 13</button>
  <button class="verlauf">Ideen fürs Team-Event</button>
  <button class="verlauf">User Story Login</button>
  <div class="konto">Firmenkonto · Team-Plan</div>
</aside>
<main>
  <!-- Chat -->
  <section class="ansicht an" id="v-chat">
    <div class="kopf"><span id="kontext"></span><span class="modell" id="modell"></span></div>
    <div class="verlaufsfeld" id="feld"><div class="spalte" id="verlauf"></div></div>
    <div class="eingabe"><div class="box">
      <div class="chips" id="chips"></div>
      <textarea id="eingabe" placeholder="Wie kann ich helfen?"></textarea>
      <div class="zeile"><button class="rund" id="plus" title="Hinzufügen">＋</button><button class="rund senden" id="senden" title="Senden">↑</button></div>
    </div></div>
    <div class="menue" id="plusmenue"><button id="m-datei">📎 Datei hochladen</button><button id="m-foto">🖼 Foto oder Screenshot</button><button id="m-drive">☁ Aus Cloud-Speicher</button></div>
  </section>
  <!-- Sammlung: Projekte bzw. Gems -->
  <section class="ansicht" id="v-sammlung"><div class="seite">
    <h1 id="s-titel">Projekte</h1><p id="s-text"></p>
    <button class="knopf" id="s-neu">＋ Neues Projekt</button>
    <div class="karten" id="s-karten"></div>
  </div></section>
  <!-- Neu anlegen -->
  <section class="ansicht" id="v-neu"><div class="seite">
    <h1 id="n-titel">Neues Projekt</h1>
    <div class="zwei">
      <div style="display:grid;gap:14px">
        <div class="feld"><label for="n-name">Name</label><input id="n-name" placeholder="z. B. Retro-Assistent"></div>
        <div class="feld"><label for="n-anw" id="n-anw-l">Anweisungen</label><textarea id="n-anw" placeholder="Wie soll der Assistent arbeiten?"></textarea></div>
        <button class="knopf" id="n-fertig">Erstellen</button>
      </div>
      <div class="wissen"><b id="n-wissen-t">Wissen</b><span style="color:var(--tinte2);font-size:13px">Dokumente, die in jedem Chat verfügbar sind</span>
        <div id="n-dateien" style="display:grid;gap:8px"></div><button class="rund" id="n-plus" style="border-radius:10px;width:auto;padding:0 12px;height:34px">＋ Datei hinzufügen</button></div>
    </div>
  </div></section>
</main>
<script>
(() => {
  const app = new URLSearchParams(location.search).get('app') || 'claude';
  const T = {
    claude: { name: 'Claude', modell: 'Sonnet · Denkmodus aus', sammlung: 'Projekte', neu: 'Neues Projekt', text: 'Projekte bündeln Chats mit festen Anweisungen und eigenem Wissen.', anw: 'Projektanweisungen', wissen: 'Projektwissen', gruss: 'Guten Morgen', gruss2: 'Womit fangen wir heute an?' },
    gemini: { name: 'Gemini', modell: 'Modell: schnell', sammlung: 'Gems', neu: 'Neues Gem', text: 'Gems sind eigene Assistenten mit festen Anleitungen und Wissen.', anw: 'Anleitung', wissen: 'Wissen', gruss: 'Hallo', gruss2: 'Wie kann ich dir heute helfen?' },
  }[app];
  document.body.classList.add(app);
  const $ = (s) => document.querySelector(s);
  $('#appname').textContent = T.name; $('#modell').textContent = T.modell;
  $('#t-sammlung').textContent = T.sammlung; $('#s-titel').textContent = T.sammlung; $('#s-text').textContent = T.text;
  $('#s-neu').textContent = '＋ ' + T.neu; $('#n-titel').textContent = T.neu; $('#n-anw-l').textContent = T.anw; $('#n-wissen-t').textContent = T.wissen;
  $('#band').textContent = `Vereinfachte Nachbildung von ${T.name} für den Kurs · die echte Oberfläche sieht je nach Version etwas anders aus`;
  const verlauf = $('#verlauf'), feld = $('#feld');
  const gruss = () => { verlauf.innerHTML = `<div class="gruss">${T.gruss}<small>${T.gruss2}</small></div>`; };
  gruss();
  const zeige = (id) => { document.querySelectorAll('.ansicht').forEach((a) => a.classList.toggle('an', a.id === id)); $('#nav-chats').classList.toggle('an', id === 'v-chat'); $('#nav-sammlung').classList.toggle('an', id !== 'v-chat'); };
  const esc = (t) => t.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const fett = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  let anhaenge = [];
  window.demo = {
    zeige,
    kontext(t) { $('#kontext').textContent = t; },
    neuerChat() { zeige('v-chat'); gruss(); $('#chips').innerHTML = ''; anhaenge = []; },
    senden() {
      const t = $('#eingabe').value.trim(); if (!t && !anhaenge.length) return;
      if (verlauf.querySelector('.gruss')) verlauf.innerHTML = '';
      anhaenge.forEach((a) => verlauf.insertAdjacentHTML('beforeend', `<div class="anhangkarte"><i>PDF</i>${esc(a)}</div>`));
      if (t) verlauf.insertAdjacentHTML('beforeend', `<div class="msg ich">${esc(t)}</div>`);
      $('#eingabe').value = ''; $('#chips').innerHTML = ''; anhaenge = [];
      feld.scrollTop = feld.scrollHeight;
    },
    antworte(text, msProWort = 55) {
      return new Promise((fertig) => {
        const el = document.createElement('div'); el.className = 'msg ki'; verlauf.appendChild(el);
        const woerter = text.split(/(\s+)/); let i = 0;
        const schritt = () => {
          i += 2; el.innerHTML = fett(woerter.slice(0, i).join('')) + (i < woerter.length ? '<span class="cursor"></span>' : '');
          feld.scrollTop = feld.scrollHeight;
          if (i < woerter.length) setTimeout(schritt, msProWort); else fertig();
        };
        setTimeout(schritt, 500);
      });
    },
    anhang(name) { anhaenge.push(name); $('#chips').insertAdjacentHTML('beforeend', `<span class="chip"><i>PDF</i>${esc(name)}</span>`); $('#plusmenue').classList.remove('an'); },
    wissen(name) { $('#n-dateien').insertAdjacentHTML('beforeend', `<span class="chip"><i>PDF</i>${esc(name)}</span>`); },
    karte(name, text) { $('#s-karten').insertAdjacentHTML('afterbegin', `<div class="karte"><b>${esc(name)}</b><span>${esc(text)}</span></div>`); },
  };
  $('#neuer-chat').onclick = () => demo.neuerChat();
  $('#nav-chats').onclick = () => zeige('v-chat');
  $('#nav-sammlung').onclick = () => zeige('v-sammlung');
  $('#s-neu').onclick = () => zeige('v-neu');
  $('#senden').onclick = () => demo.senden();
  $('#plus').onclick = () => { const m = $('#plusmenue'), r = $('#plus').getBoundingClientRect(), mr = document.querySelector('main').getBoundingClientRect(); m.style.left = (r.left - mr.left) + 'px'; m.style.top = (r.top - mr.top - 138) + 'px'; m.classList.toggle('an'); };
  $('#n-fertig').onclick = () => { demo.karte($('#n-name').value || 'Ohne Namen', 'gerade erstellt'); zeige('v-sammlung'); };
  demo.karte('Sprint-Reviews', 'Stakeholder-Zusammenfassungen');
  demo.karte('Stellenanzeigen', 'Vorlagen fürs Recruiting');
})();
</script>
</body>
</html>
