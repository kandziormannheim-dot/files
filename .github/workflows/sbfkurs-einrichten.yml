# Den SBF-Kurs (sbfkurs/) auf dem Plesk-Server einrichten und deployen —
# vom GitHub-Runner aus, nach dem Muster von "Womo einrichten" (Schlüssel-
# Pinning, CLI-Gateway, SSH über frisch gesetztes Systembenutzer-Passwort).
# Läuft gefahrlos mehrfach: Subdomain und Verzeichnisse werden nur angelegt,
# wenn sie fehlen; App-Dateien und Inhalte werden aktualisiert; die
# Konfiguration wird mit dem übergebenen Admin-Passwort und frischem Salz neu
# geschrieben. Die Datenbank (sbfkurs-daten/) bleibt unangetastet.
#
# Vor dem Übertragen laufen Syntaxprüfung, Anwendungstests und die
# Inhaltsprüfung — mit kaputten Inhalten wird nichts deployt.
#
# Ablauf auf dem Server (Heimat des Systembenutzers von kandzior.de):
#
#   sbfkurs-app/public/    ← Webroot der Subdomain (Front-Controller + Assets)
#   sbfkurs-app/src/       ← Anwendungscode, nicht ausgeliefert
#   sbfkurs-app/content/   ← Lektionen, Fragen, Übungen, nicht ausgeliefert
#   sbfkurs-config.php     ← Konfiguration, oberhalb jedes Webroots
#   sbfkurs-daten/         ← SQLite, Spool
#
# Die Anwendung verschickt keine Mails — es gibt deshalb kein Versand-Postfach.
#
# Voraussetzung: der DNS-Eintrag der Subdomain (Workflow "DNS-Eintrag
# setzen", Name "sbfkurs"). Fehlt er noch, läuft alles bis auf Let's Encrypt
# trotzdem durch — der Zertifikatsschritt warnt dann und lässt sich nach dem
# DNS-Eintrag einfach wiederholen.

name: SBF-Kurs einrichten

on:
  workflow_dispatch:
    inputs:
      plesk_passwort:
        description: "Plesk-Admin-Passwort (leer = Repository-Secret PLESK_PASSWORT verwenden)"
        required: false
        default: ""
        type: string
      admin_email:
        description: "E-Mail des Admin-Kontos der Kursanwendung"
        required: true
        default: mail@kandzior.de
        type: string
      admin_passwort:
        description: "Passwort des Admin-Kontos (leer = Repository-Secret SBFKURS_ADMIN_PASSWORT; nur der Hash landet auf dem Server)"
        required: false
        default: ""
        type: string
      einladungscode:
        description: "Einladungscode für die Selbstregistrierung (leer = erzeugen und in der Zusammenfassung zeigen; '-' = keine Selbstregistrierung)"
        required: false
        default: ""
        type: string
      subdomain:
        description: "Vollständige Subdomain"
        required: true
        default: sbfkurs.kandzior.de
        type: string
      domain:
        description: "Elterndomain in Plesk"
        required: true
        default: kandzior.de
        type: string

concurrency:
  group: deploy-plesk
  cancel-in-progress: false

jobs:
  einrichten:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLESK: https://95.216.18.216:8443
      DOMAIN: ${{ inputs.domain }}
      SUB: ${{ inputs.subdomain }}
    steps:
      - name: Passwörter auflösen und maskieren
        env:
          PLESK_PW: ${{ inputs.plesk_passwort || secrets.PLESK_PASSWORT }}
          KURS_PW: ${{ inputs.admin_passwort || secrets.SBFKURS_ADMIN_PASSWORT }}
        run: |
          [ -n "$PLESK_PW" ] \
            || { echo "::error::Kein Plesk-Passwort: weder als Eingabe übergeben noch als Repository-Secret PLESK_PASSWORT hinterlegt (Settings → Secrets and variables → Actions)."; exit 1; }
          [ -n "$KURS_PW" ] \
            || { echo "::error::Kein Admin-Passwort für den Kurs: weder als Eingabe übergeben noch als Repository-Secret SBFKURS_ADMIN_PASSWORT hinterlegt."; exit 1; }
          [ "${#KURS_PW}" -ge 10 ] \
            || { echo "::error::Das Admin-Passwort braucht mindestens 10 Zeichen — die Anwendung verlangt das auch von allen anderen Konten."; exit 1; }
          echo "::add-mask::$PLESK_PW"
          echo "::add-mask::$KURS_PW"

      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: PHP 8.2 wie auf dem Server
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Tests und Inhaltsprüfung — sonst kein Deploy
        run: |
          set -e
          find sbfkurs -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php sbfkurs/tests/lauf.php
          php sbfkurs/werkzeuge/katalog-pruefen.php

      - name: Plesk erreichen und Schlüssel festnageln
        id: pin
        env:
          PW: ${{ inputs.plesk_passwort || secrets.PLESK_PASSWORT }}
        run: |
          set -euo pipefail
          HOST=${PLESK#https://}
          PIN=$(openssl s_client -connect "$HOST" -servername plesk </dev/null 2>/dev/null \
            | openssl x509 -pubkey -noout \
            | openssl pkey -pubin -outform der \
            | openssl dgst -sha256 -binary | base64)
          echo "pin=sha256//$PIN" >> "$GITHUB_OUTPUT"
          echo "Schlüssel-Fingerabdruck: sha256//$PIN"
          CODE=$(curl -sk --pinnedpubkey "sha256//$PIN" -o /tmp/server.json -w '%{http_code}' \
            -u "admin:$PW" "$PLESK/api/v2/server")
          if [ "$CODE" != "200" ]; then
            echo "::error::Plesk-API antwortet mit HTTP $CODE — Zugangsdaten oder Erreichbarkeit prüfen."
            cat /tmp/server.json || true
            exit 1
          fi
          jq -r '"Plesk \(.platform // "?") \(.version // "?")"' /tmp/server.json

      - name: Zugang für diesen Lauf vorbereiten (SSH)
        id: ssh
        env:
          PW: ${{ inputs.plesk_passwort || secrets.PLESK_PASSWORT }}
          PIN: ${{ steps.pin.outputs.pin }}
        run: |
          set -euo pipefail
          # Wie im Deploy-Workflow: Systembenutzer ermitteln, Passwort je
          # Lauf frisch setzen.
          api() { curl -sk --pinnedpubkey "$PIN" -u "admin:$PW" "$@"; }
          INFO=$(api -X POST -H 'Content-Type: application/json' \
            -d '{"params":["--info","'"$DOMAIN"'"]}' "$PLESK/api/v2/cli/site/call")
          SYSUSER=$(echo "$INFO" | jq -r '.stdout' | sed -n 's/^FTP Login:[[:space:]]*//p' | head -1)
          [ -n "$SYSUSER" ] || { echo "::error::Systembenutzer nicht ermittelbar."; exit 1; }
          echo "Systembenutzer: $SYSUSER"
          SSH_PASS="$(openssl rand -base64 24 | tr -d '/+=' | head -c 20)aZ9!_"
          echo "::add-mask::$SSH_PASS"
          OK=""
          for util in site subscription; do
            ANTWORT=$(api -X POST -H 'Content-Type: application/json' \
              -d "$(jq -n --arg d "$DOMAIN" --arg p "$SSH_PASS" '{params:["--update",$d,"-passwd",$p]}')" \
              "$PLESK/api/v2/cli/$util/call")
            echo "[$util] $(echo "$ANTWORT" | jq -c '{code, stdout: (.stdout // "")[:200], stderr: (.stderr // "")[:300]}')"
            if echo "$ANTWORT" | jq -e '.code == 0' >/dev/null; then OK=ja; break; fi
          done
          [ "$OK" = ja ] \
            || { echo "::error::Passwort des Systembenutzers ließ sich nicht setzen."; exit 1; }
          echo "user=$SYSUSER" >> "$GITHUB_OUTPUT"
          echo "pass=$SSH_PASS" >> "$GITHUB_OUTPUT"

      - name: Subdomain anlegen (physisch, Webroot sbfkurs-app/public)
        env:
          PW: ${{ inputs.plesk_passwort || secrets.PLESK_PASSWORT }}
          PIN: ${{ steps.pin.outputs.pin }}
        run: |
          set -euo pipefail
          api() { curl -sk --pinnedpubkey "$PIN" -u "admin:$PW" "$@"; }
          cli() {
            local cmd=$1; shift
            local params
            params=$(printf '%s\n' "$@" | jq -R . | jq -s .)
            api -X POST -H 'Content-Type: application/json' \
              -d "{\"params\":$params}" "$PLESK/api/v2/cli/$cmd/call"
          }
          zeig() { jq -c '{code, stdout: (.stdout // "")[:300], stderr: (.stderr // "")[:300]}' <<<"$1"; }
          gut() { echo "$1" | jq -e '.code == 0' >/dev/null; }

          NAME=${SUB%%.*}
          if gut "$(cli site --info "$SUB")"; then
            echo "== $SUB existiert schon — Webroot ggf. nachziehen =="
            A=$(cli subdomain --update "$NAME" -domain "$DOMAIN" -www-root sbfkurs-app/public)
            zeig "$A"
            gut "$A" || echo "::warning::Webroot ließ sich nicht aktualisieren — falls er nicht auf sbfkurs-app/public zeigt, in Plesk prüfen."
          else
            echo "== $SUB anlegen =="
            # Versuchskette wegen der CLI-Dialekte (gelernt im
            # Subdomain-Workflow): erst mit verschachteltem Webroot, sonst
            # anlegen und den Webroot nachträglich setzen.
            A=$(cli subdomain --create "$NAME" -domain "$DOMAIN" -www-root sbfkurs-app/public)
            zeig "$A"
            if ! gut "$A"; then
              A=$(cli subdomain --create "$NAME" -domain "$DOMAIN" -www-root "$NAME")
              zeig "$A"
              gut "$A" || { echo "::error::Subdomain ließ sich nicht anlegen."; exit 1; }
              A=$(cli subdomain --update "$NAME" -domain "$DOMAIN" -www-root sbfkurs-app/public)
              zeig "$A"
              gut "$A" || { echo "::error::Webroot ließ sich nicht auf sbfkurs-app/public setzen — die App darf nicht mit src/ im Webroot laufen."; exit 1; }
            fi
          fi

          echo "== Kontrolle =="
          cli site --info "$SUB" | jq -r '.stdout // .stderr // empty' | sed -n '1,20p'

      - name: App-Dateien übertragen (rsync über SSH)
        env:
          SSH_USER: ${{ steps.ssh.outputs.user }}
          SSH_PASS: ${{ steps.ssh.outputs.pass }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -q sshpass >/dev/null
          HOST=${PLESK#https://}; HOST=${HOST%:8443}
          SSHOPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          echo "== Zielstruktur anlegen =="
          timeout 60 sshpass -p "$SSH_PASS" ssh $SSHOPTS "$SSH_USER@$HOST" \
            'mkdir -p sbfkurs-app/public sbfkurs-app/src sbfkurs-app/content sbfkurs-daten && chmod 700 sbfkurs-daten && ls -la sbfkurs-app'
          echo "== public/, src/ und content/ übertragen =="
          for teil in public src content; do
            timeout 300 sshpass -p "$SSH_PASS" rsync -az --delete --itemize-changes \
              -e "ssh $SSHOPTS" "sbfkurs/$teil/" "$SSH_USER@$HOST:sbfkurs-app/$teil/" | tail -20
          done

      - name: Konfiguration schreiben
        id: konf
        env:
          SSH_USER: ${{ steps.ssh.outputs.user }}
          SSH_PASS: ${{ steps.ssh.outputs.pass }}
          ADMIN_EMAIL: ${{ inputs.admin_email }}
          ADMIN_PASS: ${{ inputs.admin_passwort || secrets.SBFKURS_ADMIN_PASSWORT }}
          CODE_EINGABE: ${{ inputs.einladungscode }}
        run: |
          set -euo pipefail
          HOST=${PLESK#https://}; HOST=${HOST%:8443}
          SSHOPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          HOME_DIR=$(timeout 60 sshpass -p "$SSH_PASS" ssh $SSHOPTS "$SSH_USER@$HOST" 'pwd')
          echo "Heimatverzeichnis: $HOME_DIR"
          HASH=$(php -r 'echo password_hash($argv[1], PASSWORD_DEFAULT);' "$ADMIN_PASS")
          SALZ=$(openssl rand -hex 32)
          # Einladungscode: Eingabe, sonst frisch erzeugt, '-' schaltet die
          # Selbstregistrierung ab (dann legt der Admin Konten/Einmalcodes an).
          if [ "$CODE_EINGABE" = "-" ]; then
            CODE=""
          elif [ -n "$CODE_EINGABE" ]; then
            CODE="$CODE_EINGABE"
          else
            CODE=$(openssl rand -base64 12 | tr -dc 'A-HJ-NP-Z2-9' | head -c 10)
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          cat > /tmp/sbfkurs-config.php <<KONF
          <?php

          /**
           * Konfiguration des SBF-Kurses — liegt bewusst OBERHALB der Webroots.
           * Angelegt vom Workflow "SBF-Kurs einrichten"; ein erneuter Lauf
           * überschreibt die Datei (neues Admin-Passwort, frisches Salz), lässt
           * sbfkurs-daten/ aber unangetastet.
           */
          return [
              'titel' => 'SBF-Kurs',
              'adminEmail' => '$ADMIN_EMAIL',
              'adminPasswortHash' => '$HASH',
              'einladungscode' => '$CODE',
              'daten' => '$HOME_DIR/sbfkurs-daten',
              'basisUrl' => 'https://$SUB',
              'salz' => '$SALZ',
          ];
          KONF
          timeout 60 sshpass -p "$SSH_PASS" scp $SSHOPTS /tmp/sbfkurs-config.php "$SSH_USER@$HOST:sbfkurs-config.php"
          timeout 60 sshpass -p "$SSH_PASS" ssh $SSHOPTS "$SSH_USER@$HOST" \
            'chmod 600 sbfkurs-config.php && ls -la sbfkurs-config.php sbfkurs-daten'

      - name: Zertifikat für HTTPS versuchen (Let's Encrypt)
        continue-on-error: true
        env:
          PW: ${{ inputs.plesk_passwort || secrets.PLESK_PASSWORT }}
          PIN: ${{ steps.pin.outputs.pin }}
        run: |
          set -euo pipefail
          api() { curl -sk --pinnedpubkey "$PIN" -u "admin:$PW" "$@"; }
          cli() {
            local cmd=$1; shift
            local params
            params=$(printf '%s\n' "$@" | jq -R . | jq -s .)
            api -X POST -H 'Content-Type: application/json' \
              -d "{\"params\":$params}" "$PLESK/api/v2/cli/$cmd/call"
          }
          echo "== Öffentliche Auflösung (Diagnose) =="
          echo "A $SUB: $(dig +short "$SUB" A | tr '\n' ' ')"
          A=$(cli extension --exec letsencrypt cli.php -d "$SUB")
          echo "$A" | jq -r '"code=\(.code)\n--- stdout ---\n\((.stdout // "")[:800])\n--- stderr ---\n\((.stderr // "")[:1500])"'
          echo "$A" | jq -e '.code == 0' >/dev/null \
            || echo "::warning::Let's Encrypt für $SUB scheiterte — meist fehlt nur der DNS-Eintrag (Workflow »DNS-Eintrag setzen«, Name »sbfkurs«). Danach diesen Workflow erneut laufen lassen."

      - name: Selbsttest
        env:
          SSH_USER: ${{ steps.ssh.outputs.user }}
          SSH_PASS: ${{ steps.ssh.outputs.pass }}
          CODE: ${{ steps.konf.outputs.code }}
        run: |
          set -euo pipefail
          IP=${PLESK#https://}; IP=${IP%:8443}
          diagnose() {
            echo "== Diagnose: PHP-Zeilen aus den vHost-Protokollen =="
            timeout 60 sshpass -p "$SSH_PASS" ssh \
              -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              "$SSH_USER@$IP" \
              'grep -h -i "php" logs/*error*log* 2>/dev/null | tail -5; ls logs/ 2>/dev/null | head' \
              || echo "(Protokolle nicht erreichbar)"
          }
          echo "== /status: bereit muss true sein =="
          ANTWORT=$(curl -sk --resolve "$SUB:443:$IP" "https://$SUB/status")
          echo "$ANTWORT"
          echo "$ANTWORT" | jq -e '.ok == true and .dienst == "sbfkurs" and .bereit == true' >/dev/null \
            || { echo "::error::Die App meldet sich nicht bereit — kommt PHP-Quelltext statt JSON, fehlt die PHP-Anbindung der Subdomain (in Plesk: PHP für $SUB aktivieren)."; diagnose; exit 1; }
          echo "== / muss zur Anmeldung umleiten =="
          CODE_HTTP=$(curl -sk -o /dev/null -w '%{http_code}' --resolve "$SUB:443:$IP" "https://$SUB/")
          ORT=$(curl -sk -o /dev/null -D - --resolve "$SUB:443:$IP" "https://$SUB/" | tr -d '\r' | sed -n 's/^Location: //p')
          echo "HTTP $CODE_HTTP -> $ORT"
          { [ "$CODE_HTTP" = "302" ] && [ "$ORT" = "/login" ]; } \
            || { echo "::error::Startseite leitet nicht zur Anmeldung um — greift die .htaccess nicht (Front-Controller)?"; diagnose; exit 1; }
          echo "== /kurs/src muss ohne Anmeldung ebenfalls umleiten =="
          CODE_HTTP=$(curl -sk -o /dev/null -w '%{http_code}' --resolve "$SUB:443:$IP" "https://$SUB/kurs/src")
          [ "$CODE_HTTP" = "302" ] || { echo "::error::/kurs/src antwortet mit $CODE_HTTP statt 302."; exit 1; }
          echo "== Login-Seite und Assets =="
          CODE_HTTP=$(curl -sk -o /tmp/login.html -w '%{http_code}' --resolve "$SUB:443:$IP" "https://$SUB/login")
          grep -q 'name="passwort"' /tmp/login.html && [ "$CODE_HTTP" = "200" ] \
            || { echo "::error::Login-Seite fehlt oder zeigt kein Formular."; exit 1; }
          for asset in /assets/style.css /assets/app.js /assets/dsc.js; do
            CODE_HTTP=$(curl -sk -o /dev/null -w '%{http_code}' --resolve "$SUB:443:$IP" "https://$SUB$asset")
            [ "$CODE_HTTP" = "200" ] || { echo "::error::$asset wird nicht ausgeliefert (HTTP $CODE_HTTP)."; exit 1; }
          done
          echo "== src/ und content/ dürfen nicht öffentlich sein =="
          CODE_HTTP=$(curl -sk -o /dev/null -w '%{http_code}' --resolve "$SUB:443:$IP" "https://$SUB/../src/bootstrap.php")
          [ "$CODE_HTTP" != "200" ] || { echo "::error::src/ ist über das Webroot erreichbar."; exit 1; }
          echo
          {
            echo "## SBF-Kurs eingerichtet"
            echo
            echo "- Adresse: https://$SUB"
            echo "- Admin-Konto: ${{ inputs.admin_email }} (Passwort aus dem Lauf)"
            if [ -n "$CODE" ]; then echo "- Einladungscode für die Registrierung: \`$CODE\`"; else echo "- Selbstregistrierung: aus — Konten und Einmalcodes legt der Admin unter /admin an."; fi
            echo "- Inhalte: Beispielfragen, solange die amtlichen Kataloge nicht importiert sind (docs/sbfkurs/INHALTE.md)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Eingerichtet: https://$SUB steht."
