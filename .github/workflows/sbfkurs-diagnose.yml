# SBF-Kurs-Diagnose: Warum antwortet die Subdomain nicht mit der App? — vom
# GitHub-Runner aus, nach dem Muster der Womo-Diagnose (Schlüssel-Pinning,
# CLI-Gateway, SSH über frisch gesetztes Systembenutzer-Passwort).
#
# Geprüft wird von innen (auf dem Server selbst): nginx, Apache direkt,
# Hosting-Einstellungen der Subdomain laut Plesk (CLI und XML-API),
# Webroot-Inhalt, Protokolle der Subdomain, lesbare vHost-Dateien.
#
# Der letzte Schritt repariert: PHP-Handler wie bei der Vergleichs-Subdomain,
# SSL aus/an und Webroot neu setzen (erzwingt die Neuerzeugung der
# vHost-Konfiguration), dazu »plesk repair web«, sofern das Gateway es
# durchreicht. Jeder Schritt meldet, ob /status danach antwortet.

name: SBF-Kurs-Diagnose

on:
  workflow_dispatch:
    inputs:
      plesk_passwort:
        description: "Plesk-Admin-Passwort (leer = Repository-Secret PLESK_PASSWORT verwenden)"
        required: false
        default: ""
        type: string
      subdomain:
        description: "Subdomain der Kursanwendung"
        required: true
        default: sbfkurs.kandzior.de
        type: string
      vergleich:
        description: "Funktionierende Schwester-Subdomain zum Vergleich"
        required: true
        default: womo.kandzior.de
        type: string
      domain:
        description: "Elterndomain in Plesk"
        required: true
        default: kandzior.de
        type: string

concurrency:
  group: deploy-plesk
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLESK: https://95.216.18.216:8443
      DOMAIN: ${{ inputs.domain }}
      SUB: ${{ inputs.subdomain }}
      VERGLEICH: ${{ inputs.vergleich }}
    steps:
      - name: Passwort auflösen und maskieren
        # Eingabe geht vor; ohne Eingabe zählen die Repository-Secrets.
        # Eingaben werden aus dem Ereignis-JSON maskiert — ein Schritt-env
        # stünde sonst im Protokollkopf, bevor die Maske greift; Secrets
        # maskiert GitHub von selbst.
        env:
          PLESK_PASSWORT: ${{ secrets.PLESK_PASSWORT }}
        run: |
          EINGABE=$(jq -r '.inputs.plesk_passwort // ""' "$GITHUB_EVENT_PATH")
          [ -z "$EINGABE" ] || echo "::add-mask::$EINGABE"
          [ -n "$EINGABE" ] || [ -n "$PLESK_PASSWORT" ] \
            || { echo "::error::Kein Plesk-Passwort: weder als Eingabe übergeben noch als Repository-Secret PLESK_PASSWORT hinterlegt."; exit 1; }

      - name: Plesk erreichen und Schlüssel festnageln
        id: pin
        env:
          PW: ${{ inputs.plesk_passwort || secrets.PLESK_PASSWORT }}
        run: |
          set -euo pipefail
          HOST=${PLESK#https://}
          PIN=$(openssl s_client -connect "$HOST" -servername plesk </dev/null 2>/dev/null \
            | openssl x509 -pubkey -noout \
            | openssl pkey -pubin -outform der \
            | openssl dgst -sha256 -binary | base64)
          echo "pin=sha256//$PIN" >> "$GITHUB_OUTPUT"
          CODE=$(curl -sk --pinnedpubkey "sha256//$PIN" -o /dev/null -w '%{http_code}' \
            -u "admin:$PW" "$PLESK/api/v2/server")
          [ "$CODE" = 200 ] || { echo "::error::Plesk-API antwortet mit HTTP $CODE."; exit 1; }

      - name: Hosting-Einstellungen laut Plesk (Subdomain und Vergleich)
        env:
          PW: ${{ inputs.plesk_passwort || secrets.PLESK_PASSWORT }}
          PIN: ${{ steps.pin.outputs.pin }}
        run: |
          set -euo pipefail
          api() { curl -sk --pinnedpubkey "$PIN" -u "admin:$PW" "$@"; }
          cli() {
            local cmd=$1; shift
            local params
            params=$(printf '%s\n' "$@" | jq -R . | jq -s .)
            api -X POST -H 'Content-Type: application/json' \
              -d "{\"params\":$params}" "$PLESK/api/v2/cli/$cmd/call"
          }
          for d in "$SUB" "$VERGLEICH"; do
            echo "== site --info $d =="
            cli site --info "$d" | jq -r '.stdout // .stderr // empty' \
              | grep -iE 'Domain name|status|Hosting type|WWW|root|PHP|SSL|nginx|Apache|cgi|Web statistics|Document' || true
            echo
          done
          echo "== php_handler --list =="
          cli php_handler --list | jq -r '.stdout // .stderr // empty' | head -30

      - name: Zugang für diesen Lauf vorbereiten (SSH)
        id: ssh
        env:
          PW: ${{ inputs.plesk_passwort || secrets.PLESK_PASSWORT }}
          PIN: ${{ steps.pin.outputs.pin }}
        run: |
          set -euo pipefail
          api() { curl -sk --pinnedpubkey "$PIN" -u "admin:$PW" "$@"; }
          INFO=$(api -X POST -H 'Content-Type: application/json' \
            -d '{"params":["--info","'"$DOMAIN"'"]}' "$PLESK/api/v2/cli/site/call")
          SYSUSER=$(echo "$INFO" | jq -r '.stdout' | sed -n 's/^FTP Login:[[:space:]]*//p' | head -1)
          [ -n "$SYSUSER" ] || { echo "::error::Systembenutzer nicht ermittelbar."; exit 1; }
          SSH_PASS="$(openssl rand -base64 24 | tr -d '/+=' | head -c 20)aZ9!_"
          echo "::add-mask::$SSH_PASS"
          OK=""
          for util in site subscription; do
            ANTWORT=$(api -X POST -H 'Content-Type: application/json' \
              -d "$(jq -n --arg d "$DOMAIN" --arg p "$SSH_PASS" '{params:["--update",$d,"-passwd",$p]}')" \
              "$PLESK/api/v2/cli/$util/call")
            if echo "$ANTWORT" | jq -e '.code == 0' >/dev/null; then OK=ja; break; fi
          done
          [ "$OK" = ja ] || { echo "::error::Passwort des Systembenutzers ließ sich nicht setzen."; exit 1; }
          echo "user=$SYSUSER" >> "$GITHUB_OUTPUT"
          echo "pass=$SSH_PASS" >> "$GITHUB_OUTPUT"

      - name: Von innen anfragen — nginx, Apache direkt, Vergleichs-Subdomain
        env:
          SSH_USER: ${{ steps.ssh.outputs.user }}
          SSH_PASS: ${{ steps.ssh.outputs.pass }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -q sshpass >/dev/null
          HOST=${PLESK#https://}; HOST=${HOST%:8443}
          timeout 120 sshpass -p "$SSH_PASS" ssh \
            -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 "$SSH_USER@$HOST" \
            "SUB='$SUB' VERGLEICH='$VERGLEICH' HOST='$HOST' bash -s" <<'SKRIPT'
              kopf() { echo; echo "===== $* ====="; }
              frag() { # $1 = Beschriftung, Rest = curl-Argumente
                local was=$1; shift
                echo "--- $was"
                curl -sk -m 10 -o /tmp/antwort.txt -D /tmp/kopf.txt "$@" \
                  && { head -1 /tmp/kopf.txt; grep -iE '^(server|content-type|location|x-powered-by):' /tmp/kopf.txt; head -c 300 /tmp/antwort.txt; echo; } \
                  || echo "(keine Antwort)"
              }
              # Über die öffentliche IP mit passender SNI — genau der Weg, den
              # Browser und Selbsttest nehmen. /assets/style.css unterscheidet
              # „falscher vHost“ (404) von „Rewrite greift nicht“ (CSS kommt).
              for d in "$SUB" "$VERGLEICH"; do
                kopf "$d über nginx auf der öffentlichen IP (443, SNI passend)"
                frag "/status"           --resolve "$d:443:$HOST" "https://$d/status"
                frag "/"                 --resolve "$d:443:$HOST" "https://$d/"
                frag "/index.php"        --resolve "$d:443:$HOST" "https://$d/index.php"
                frag "/assets/style.css" --resolve "$d:443:$HOST" "https://$d/assets/style.css"
                frag "www.$d /status"    --resolve "www.$d:443:$HOST" "https://www.$d/status"
                kopf "$d über nginx auf der öffentlichen IP (80)"
                frag "/status"           --resolve "$d:80:$HOST" "http://$d/status"
                kopf "$d direkt an Apache auf der öffentlichen IP (7081, SNI passend)"
                frag "/status"           --resolve "$d:7081:$HOST" "https://$d:7081/status"
                frag "/assets/style.css" --resolve "$d:7081:$HOST" "https://$d:7081/assets/style.css"
                kopf "$d direkt an Apache über 127.0.0.1 (nur Host-Kopf)"
                frag "7080 /status" -H "Host: $d" "http://127.0.0.1:7080/status"
                frag "7081 /status" -H "Host: $d" "https://127.0.0.1:7081/status"
              done
              kopf "Wer antwortet ohne passenden Namen? (Standard-vHost)"
              frag "7081 Host: unbekannt.example" -H "Host: unbekannt.example" "https://127.0.0.1:7081/status"
              frag "443 Host: unbekannt.example" --resolve "unbekannt.example:443:$HOST" "https://unbekannt.example/status"
              kopf "Lauschende Ports (nginx/Apache)"
              (ss -ltnp 2>/dev/null || netstat -ltn 2>/dev/null) | grep -E ':(80|443|7080|7081) ' || echo "(nicht sichtbar)"
          SKRIPT

      - name: Webroot, Protokolle, vHost-Konfiguration
        env:
          SSH_USER: ${{ steps.ssh.outputs.user }}
          SSH_PASS: ${{ steps.ssh.outputs.pass }}
        run: |
          set -euo pipefail
          HOST=${PLESK#https://}; HOST=${HOST%:8443}
          timeout 120 sshpass -p "$SSH_PASS" ssh \
            -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 "$SSH_USER@$HOST" \
            "SUB='$SUB' VERGLEICH='$VERGLEICH' bash -s" <<'SKRIPT'
              kopf() { echo; echo "===== $* ====="; }
              kopf "Heimatverzeichnis"
              pwd; ls -la | grep -E 'sbfkurs|womo|httpdocs' || true
              kopf "sbfkurs-app/public"
              ls -la sbfkurs-app/public 2>&1 | head -20
              echo "--- .htaccess"; cat sbfkurs-app/public/.htaccess 2>&1
              kopf "womo-app/public (Vergleich)"
              ls -la womo-app/public 2>&1 | head -20
              kopf "Protokolle der Subdomain"
              ls -la "logs/$SUB/" 2>&1 | head -20
              for f in error_log proxy_error_log access_ssl_log access_log; do
                echo "--- logs/$SUB/$f (Ende)"; tail -n 8 "logs/$SUB/$f" 2>&1
              done
              kopf "vHost-Konfiguration (falls lesbar)"
              for d in "$SUB" "$VERGLEICH"; do
                echo "--- /var/www/vhosts/system/$d/conf/"
                ls -la "/var/www/vhosts/system/$d/conf/" 2>&1 | head -20
                for f in httpd.conf last_httpd.conf nginx.conf last_nginx.conf; do
                  p="/var/www/vhosts/system/$d/conf/$f"
                  [ -r "$p" ] && { echo "--- $p"; grep -nE 'DocumentRoot|ServerName|AllowOverride|proxy_pass|root |fcgi|php|Include|ErrorOverride|<Directory' "$p" | head -40; }
                done
              done
              kopf "Datei-Rechte auf dem Weg zum Webroot"
              namei -l "$(pwd)/sbfkurs-app/public/index.php" 2>&1 || ls -ld "$(pwd)" "$(pwd)/sbfkurs-app" "$(pwd)/sbfkurs-app/public"
              kopf "Serverweite vHost-Dateien (falls lesbar)"
              for v in /etc/apache2/plesk.conf.d/vhosts /etc/nginx/plesk.conf.d/vhosts /etc/apache2/plesk.conf.d /etc/nginx/plesk.conf.d; do
                echo "--- $v"; ls -la "$v" 2>&1 | head -40
              done
              for f in /etc/apache2/plesk.conf.d/vhosts/*kandzior* /etc/nginx/plesk.conf.d/vhosts/*kandzior* /etc/apache2/plesk.conf.d/server.conf /etc/nginx/plesk.conf.d/server.conf; do
                [ -r "$f" ] && { echo "--- $f"; grep -nE 'VirtualHost|ServerName|ServerAlias|DocumentRoot|AllowOverride|server_name|listen|root |proxy_pass|SSLCertificate|ssl_certificate|Include' "$f" | head -60; }
              done
              echo "--- Wildcard-/Alias-Treffer in allen lesbaren vHost-Dateien"
              grep -lE 'ServerAlias .*\*|server_name .*\*' /etc/apache2/plesk.conf.d/vhosts/* /etc/nginx/plesk.conf.d/vhosts/* 2>/dev/null || echo "(keine lesbaren Treffer)"
              echo "--- welche vHost-Dateien nennen $SUB?"
              grep -lF "$SUB" /etc/apache2/plesk.conf.d/vhosts/* /etc/nginx/plesk.conf.d/vhosts/* 2>/dev/null || echo "(keine lesbaren Treffer)"
          SKRIPT

      - name: Alle Domains, Aliasse und volle Hosting-Infos laut Plesk
        env:
          PW: ${{ inputs.plesk_passwort || secrets.PLESK_PASSWORT }}
          PIN: ${{ steps.pin.outputs.pin }}
        run: |
          set -euo pipefail
          api() { curl -sk --pinnedpubkey "$PIN" -u "admin:$PW" "$@"; }
          cli() {
            local cmd=$1; shift
            local params
            params=$(printf '%s\n' "$@" | jq -R . | jq -s .)
            api -X POST -H 'Content-Type: application/json' \
              -d "{\"params\":$params}" "$PLESK/api/v2/cli/$cmd/call"
          }
          zeig() { jq -r '"code=\(.code)\n\(.stdout // "")\n\(.stderr // "")"' <<<"$1" | sed -n '1,120p'; }
          echo "== site --list =="; zeig "$(cli site --list)"
          echo "== domalias --list =="; zeig "$(cli domalias --list)"
          echo "== subdomain --list (falls es das gibt) =="; zeig "$(cli subdomain --list)" | head -20
          for d in "$SUB" "$VERGLEICH"; do
            echo "== site --info $d (vollständig) =="; zeig "$(cli site --info "$d")"
          done
          echo "== subscription --info $DOMAIN =="; zeig "$(cli subscription --info "$DOMAIN")" | head -60

      - name: Hosting-Eigenschaften über die XML-API (PHP-Handler, Webroot, SSL)
        env:
          PW: ${{ inputs.plesk_passwort || secrets.PLESK_PASSWORT }}
          PIN: ${{ steps.pin.outputs.pin }}
        run: |
          set -euo pipefail
          xml() { # $1 = Domainname → alle Hosting-Eigenschaften als "name=value"
            curl -sk --pinnedpubkey "$PIN" -H "HTTP_AUTH_LOGIN: admin" -H "HTTP_AUTH_PASSWD: $PW" \
              -H 'Content-Type: text/xml' \
              -d "<packet><site><get><filter><name>$1</name></filter><dataset><hosting/><gen_info/><stat/></dataset></get></site></packet>" \
              "$PLESK/enterprise/control/agent.php" \
              | python3 -c '
          import sys, xml.etree.ElementTree as ET
          w = ET.fromstring(sys.stdin.read())
          for r in w.iter("result"):
              st = r.findtext("status"); print("status:", st)
              if st != "ok":
                  print("fehler:", r.findtext("errcode"), r.findtext("errtext")); continue
              g = r.find("data/gen_info")
              if g is not None:
                  for k in ("name","status","real_size","dns_ip_address","htype","guid"):
                      v = g.findtext(k); print(f"gen_info.{k}={v}") if v is not None else None
              for p in r.iter("property"):
                  n, v = p.findtext("name"), p.findtext("value")
                  if n and n not in ("ftp_password",): print(f"{n}={v}")
          '
          }
          for d in "$SUB" "$VERGLEICH"; do
            echo "== $d =="; xml "$d"; echo
          done
          echo "== REST: Domain-Status =="
          api() { curl -sk --pinnedpubkey "$PIN" -u "admin:$PW" "$@"; }
          for d in "$SUB" "$VERGLEICH"; do
            ID=$(api "$PLESK/api/v2/domains?name=$d" | jq -r '.[0].id // empty')
            echo "$d: id=$ID status=$(api "$PLESK/api/v2/domains/$ID/status" | jq -c .)"
          done
          echo "== verfügbare CLI-Utilities mit repair/httpd im Namen =="
          api "$PLESK/api/v2/cli/commands" | jq -r '.[]' 2>/dev/null | grep -iE 'repair|httpd|nginx|reconf' || echo "(keine)"

      - name: Reparaturversuch — Handler wie Vergleichs-Subdomain, SSL neu, Konfiguration neu erzeugen
        env:
          PW: ${{ inputs.plesk_passwort || secrets.PLESK_PASSWORT }}
          PIN: ${{ steps.pin.outputs.pin }}
        run: |
          set -uo pipefail
          api() { curl -sk --pinnedpubkey "$PIN" -u "admin:$PW" "$@"; }
          cli() {
            local cmd=$1; shift
            local params
            params=$(printf '%s\n' "$@" | jq -R . | jq -s .)
            api -X POST -H 'Content-Type: application/json' \
              -d "{\"params\":$params}" "$PLESK/api/v2/cli/$cmd/call"
          }
          zeig() { jq -c '{code, stdout: (.stdout // "")[:300], stderr: (.stderr // "")[:300]}' <<<"$1"; }
          handler() {
            curl -sk --pinnedpubkey "$PIN" -H "HTTP_AUTH_LOGIN: admin" -H "HTTP_AUTH_PASSWD: $PW" \
              -H 'Content-Type: text/xml' \
              -d "<packet><site><get><filter><name>$1</name></filter><dataset><hosting/></dataset></get></site></packet>" \
              "$PLESK/enterprise/control/agent.php" \
              | python3 -c '
          import sys, xml.etree.ElementTree as ET
          w = ET.fromstring(sys.stdin.read())
          for p in w.iter("property"):
              if p.findtext("name") == "php_handler_id": print(p.findtext("value") or "")
          '
          }
          IP=${PLESK#https://}; IP=${IP%:8443}
          test_status() { curl -sk -m 10 -o /dev/null -w '%{http_code}' --resolve "$SUB:443:$IP" "https://$SUB/status"; }
          echo "Vorher: /status -> HTTP $(test_status)"

          H_SOLL=$(handler "$VERGLEICH"); H_IST=$(handler "$SUB")
          echo "PHP-Handler: $SUB=»$H_IST«, $VERGLEICH=»$H_SOLL«"
          if [ -n "$H_SOLL" ] && [ "$H_IST" != "$H_SOLL" ]; then
            echo "== PHP-Handler auf »$H_SOLL« setzen =="
            zeig "$(cli site --update "$SUB" -php_handler_id "$H_SOLL")"
            echo "Danach: /status -> HTTP $(test_status)"
          fi

          echo "== SSL aus und wieder an (erzwingt Neuerzeugung der vHost-Konfiguration) =="
          zeig "$(cli site --update "$SUB" -ssl false)"
          zeig "$(cli site --update "$SUB" -ssl true)"
          sleep 5
          echo "Danach: /status -> HTTP $(test_status)"

          echo "== Webroot erneut setzen =="
          zeig "$(cli site --update "$SUB" -www-root sbfkurs-app/public)"
          sleep 5
          echo "Danach: /status -> HTTP $(test_status)"

          echo "== plesk repair web (falls über das Gateway erreichbar) =="
          zeig "$(cli repair web "$SUB" -y)"
          sleep 5
          echo "Danach: /status -> HTTP $(test_status)"
          echo "Antwort jetzt:"; curl -sk -m 10 --resolve "$SUB:443:$IP" "https://$SUB/status" | head -c 300; echo
          echo "Assets: $(curl -sk -m 10 -o /dev/null -w '%{http_code}' --resolve "$SUB:443:$IP" "https://$SUB/assets/style.css")"
