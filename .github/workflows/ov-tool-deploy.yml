# Aktualisiert das OV-Management-Tool auf dem Server (VPS oder Plesk): git pull + docker compose up -d --build (SPEC.md 5).
# Bewusst nur manuell auslösbar. Einrichtung: .github/workflows/README.md, Abschnitt „OV-Tool“.
name: OV-Tool deployen

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch oder Tag, der auf dem Server ausgecheckt wird"
        default: main
        type: string

concurrency:
  group: ov-tool-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Konfiguration prüfen
        env:
          HOST: ${{ vars.OVTOOL_HOST }}
          USER: ${{ vars.OVTOOL_USER }}
          ZIEL: ${{ vars.OVTOOL_PATH }}
          KEY: ${{ secrets.OVTOOL_SSH_KEY }}
          KNOWN: ${{ secrets.OVTOOL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          fehlt=""
          [ -n "$HOST"  ] || fehlt="$fehlt vars.OVTOOL_HOST"
          [ -n "$USER"  ] || fehlt="$fehlt vars.OVTOOL_USER"
          [ -n "$ZIEL"  ] || fehlt="$fehlt vars.OVTOOL_PATH"
          [ -n "$KEY"   ] || fehlt="$fehlt secrets.OVTOOL_SSH_KEY"
          [ -n "$KNOWN" ] || fehlt="$fehlt secrets.OVTOOL_KNOWN_HOSTS"
          if [ -n "$fehlt" ]; then
            echo "::error::Nicht gesetzt:$fehlt — siehe .github/workflows/README.md"
            exit 1
          fi
          case "$ZIEL" in
            /*) ;;
            *) echo "::error::OVTOOL_PATH muss ein absoluter Pfad sein (Klon des Repos), ist: '$ZIEL'"; exit 1 ;;
          esac

      - name: SSH einrichten
        env:
          KEY: ${{ secrets.OVTOOL_SSH_KEY }}
          KNOWN: ${{ secrets.OVTOOL_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts

      - name: Aktualisieren und neu starten
        env:
          HOST: ${{ vars.OVTOOL_HOST }}
          USER: ${{ vars.OVTOOL_USER }}
          ZIEL: ${{ vars.OVTOOL_PATH }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          ssh "$USER@$HOST" bash -s -- "$ZIEL" "$REF" <<'SKRIPT'
          set -euo pipefail
          cd "$1"
          git fetch --tags origin
          git checkout --quiet "$2"
          git pull --ff-only origin "$2" || true
          cd ov-tool
          # Zusatzdienste (Caddy/Whisper) steuert COMPOSE_PROFILES in .env – VPS: prod, Plesk: whisper
          if ! grep -q '^COMPOSE_PROFILES=' .env; then
            echo "COMPOSE_PROFILES fehlt in .env (prod = eigener VPS mit Caddy, whisper = hinter Plesk) – siehe docs/betrieb.md"; exit 1
          fi
          docker compose up -d --build
          docker image prune -f >/dev/null
          for i in $(seq 1 30); do
            if docker compose exec -T app node -e "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              echo "App läuft."; exit 0
            fi
            sleep 5
          done
          echo "App antwortet nicht – Logs:"; docker compose logs --tail 80 app; exit 1
          SKRIPT
